.scr>:first-child{margin-top:auto}.scr>:last-child{margin-bottom:auto}

const scene=(k,i)=>{const w=k?['#dcfce7','#bbf7d0','#86efac','#d6a96a']:['#fff7d6','#fde68a','#fcd34d','#d6a96a'],id='g'+k+i;return `<svg viewBox='0 0 120 90'><defs><linearGradient id='${id}' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='${w[0]}'/><stop offset='1' stop-color='${w[1]}'/></linearGradient></defs><rect width='120' height='90' fill='url(#${id})'/><rect y='60' width='120' height='14' fill='${w[2]}' opacity='.45'/><rect y='60' width='120' height='2' fill='#0002'/><rect y='74' width='120' height='16' fill='${w[3]}'/><path d='M0 82H120M22 74L16 90M62 74V90M102 74L108 90' stroke='#0002' stroke-width='1'/><rect y='74' width='120' height='2' fill='#fff' opacity='.4'/>${IM[k][i]()}</svg>`};
const banner=()=>`<svg viewBox='0 0 240 120' style='width:100%;max-width:520px;border-radius:18px;border:3px solid #fbbf24'><defs><linearGradient id='bs' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#7c3aed'/><stop offset='1' stop-color='#f9a8d4'/></linearGradient></defs><rect width='240' height='120' fill='url(#bs)'/>${[...Array(18)].map((_,j)=>`<circle cx='${(j*37+15)%230}' cy='${(j*23)%60+6}' r='2.5' fill='${['#fde047','#f472b6','#60a5fa','#34d399'][j%4]}'/>`).join('')}<circle cx='204' cy='24' r='13' fill='#fde68a'/><path d='M0 98Q60 68 120 94T240 88V120H0Z' fill='#22c55e'/><path d='M0 108Q80 88 160 106T240 104V120H0Z' fill='#16a34a'/><rect x='18' y='54' width='56' height='42' fill='#fef3c7' stroke='#92400e' stroke-width='2'/><path d='M12 56L46 30L80 56Z' fill='#dc2626'/><rect x='38' y='74' width='16' height='22' rx='2' fill='#92400e'/><rect x='24' y='64' width='10' height='10' fill='#bae6fd' stroke='#92400e'/><rect x='58' y='64' width='10' height='10' fill='#bae6fd' stroke='#92400e'/><path d='M46 30V10' stroke='#475569' stroke-width='2'/><path d='M46 10L64 16L46 22Z' fill='#fbbf24'/><circle cx='46' cy='46' r='5' fill='#fff' stroke='#92400e'/>${HERO.replace('<svg ',"<svg x='100' y='24' width='56' height='72' ")}<text x='172' y='76' font-size='30'>🏆</text><text x='92' y='30' font-size='16'>⭐</text><text x='160' y='34' font-size='12'>✨</text></svg>`;
function final(){stop();over=true;hide();hud('冒險成果');const t=sum(),r=t>=13?'🏆 專注大勇者':t>=10?'⚔️ 專注騎士':'🛡️ 專注見習生',lo=star.map((s,i)=>[s,i]).sort((a,b)=>a[0]-b[0])[0][1];
 M.innerHTML=`<div class='scr'>${banner()}<div class='cert'><div style='font-size:14px'>勇者證書</div><div style='font-size:26px'>${r}</div><div>⭐ ${t} / 15</div></div>${S.map((s,i)=>`<div class='ab'><div style='background:linear-gradient(${s.bg});border-radius:12px;width:62px;flex:none;padding:4px'>${mon(i)}</div><div><b style='font-size:15px'>${i+1}. ${s.ab}　${'⭐'.repeat(star[i])}${'☆'.repeat(3-star[i])}</b><br>${s.tip}</div></div>`).join('')}<div class='dlg'><div class='npc'>🧙‍♀️</div><div><b>老師的話：</b>專注力像肌肉，越練越強。這次「${S[lo].ab}」最需要加油，可以多陪孩子玩「${S[lo].n}」這類遊戲！<br><small>（本遊戲為親子互動體驗，不是臨床專注力評估。）</small></div></div><div style='display:flex;gap:10px'><button class='btn sc' onclick='map()'>回地圖</button><button class='btn gd' onclick='star=[0,0,0,0,0];title()'>重新冒險</button></div></div>`}
const sceneOld=(k,i)=>`<svg viewBox="0 0 120 90"><rect width="120" height="90" fill="${k?'#dcfce7':'#fef3c7'}"/><rect y="74" width="120" height="16" fill="${k?'#86efac':'#fcd34d'}"/>${IM[k][i]()}</svg>`;
const sum=()=>star.reduce((a,b)=>a+b,0);
function hud(t){$('#ht').textContent=t||'⚔️ 專注力勇者';$('#hh').textContent=over?'':'❤️'.repeat(hearts)+'🖤'.repeat(3-hearts);$('#hs').textContent='⭐'+sum()}
const show=h=>{MD.innerHTML=h;MD.hidden=false},hide=()=>{MD.hidden=true};

function title(){stop();over=true;hide();hud();
 M.innerHTML=`<div class="scr"><div class="hero" style="width:130px">${HERO}</div><h1>專注力勇者</h1><h2 style="font-size:18px;color:#fff">小一新生闖關記</h2>
 <p>開學在即！魔王們藏在教室裡，偷走了孩子的專注力。<br>勇者，帶著你的劍，闖過 5 個關卡吧！</p><button class="btn gd" onclick="map()">開始冒險 ⚔️</button></div>`}

function map(){stop();over=true;hide();hud();
 const pos=[[20,84],[68,70],[26,52],[70,34],[40,14]];
 const ok=i=>i==0||star[i-1]>0,first=star.findIndex(s=>!s);
 let n=pos.map((p,i)=>`<button class="nd ${ok(i)?'':'lk'} ${i==first?'cu':''}" style="left:${p[0]}%;top:${p[1]}%" ${ok(i)?`onclick="intro(${i})"`:''}>${ok(i)?S[i].ic:'🔒'}<small>${i+1}. ${S[i].n}${star[i]?' '+'⭐'.repeat(star[i]):''}</small></button>`).join('');
 const all=first<0;
 M.innerHTML=`<div class="map"><div class="mtitle">🗺️ 校園冒險地圖</div><svg viewBox="0 0 100 100" preserveAspectRatio="none"><polyline points="${pos.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#fff" stroke-width="2.5" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/><ellipse cx="50" cy="100" rx="70" ry="14" fill="#16a34a"/></svg>${n}<div style="position:absolute;right:8%;top:4%;font-size:44px">🏫</div>${all?'<button class="btn gd" style="position:absolute;bottom:12px;left:50%;transform:translateX(-50%)" onclick="final()">查看冒險成果 🎓</button>':''}</div>`}

function intro(i){stop();over=true;hud('第 '+(i+1)+' 關：'+S[i].n);
 M.innerHTML=`<div class="arena" style="background:linear-gradient(${S[i].bg});height:36%"><div class="mon">${mon(i)}<b class="mn">${S[i].mon}</b></div><div class="hero">${HERO}</div></div>
 <div class="scr" style="background:#0f0a2e"><div class="dlg"><div class="npc">🧙‍♀️</div><div><b>【${S[i].ab}】</b>${S[i].mean}<br><b>【怎麼玩】</b>${S[i].how}</div></div>
 <div style="display:flex;gap:10px"><button class="btn sc" onclick="map()">返回地圖</button><button class="btn gd" onclick="battle(${i})">出戰！⚔️</button></div></div>`}

function battle(i){stop();cur=i;hearts=3;mhp=hp=S[i].hp;over=false;hud('第 '+(i+1)+' 關：'+S[i].n);hide();
 M.innerHTML=`<div class="arena" id="ar" style="background:linear-gradient(${S[i].bg})"><div class="tbar"><i id="tf"></i></div><div class="mon" id="mo">${mon(i)}<div class="hpb"><i id="hf"></i></div><b class="mn">${S[i].mon}</b></div><div class="hero" id="he">${HERO}</div></div><div class="panel" id="pn"></div>`;
 AR=$('#ar');P=$('#pn');G[i]();
 const f=$('#tf'),s=S[i].t;f.style.transition='none';f.style.width='100%';void f.offsetWidth;f.style.transition=`width ${s}s linear`;f.style.width='0%';
 to(()=>{if(!over)end(false,'時間到了！')},s*1000)}

function fl(t,id){const e=document.getElementById(id);if(!e)return;const s=document.createElement('span');s.className='fx';s.textContent=t;e.appendChild(s);setTimeout(()=>s.remove(),900)}
function hit(d=1){if(over)return;sfx('ok');hp=Math.max(0,hp-d);$('#hf').style.width=hp/mhp*100+'%';const m=$('#mo');m.classList.remove('sh');void m.offsetWidth;m.classList.add('sh');fl('-'+d+' 💥','mo');if(!hp)end(true)}
function hurt(){if(over)return;sfx('no');hearts--;hud('第 '+(cur+1)+' 關：'+S[cur].n);const a=$('#app');a.classList.remove('hurt');void a.offsetWidth;a.classList.add('hurt');fl('💔','he');if(!hearts)end(false,'愛心用完了！')}

function end(win,msg){over=true;stop();hud('第 '+(cur+1)+' 關：'+S[cur].n);
 if(win){star[cur]=Math.max(star[cur],hearts);hud();sfx('win');
  to(()=>show(`<div style="font-size:60px">🎉</div><h2>擊敗了${S[cur].mon}！</h2><div class="stars">${'⭐'.repeat(hearts)}${'☆'.repeat(3-hearts)}</div>
  <div class="ic">${scene(0,cur)}<div><h3>🏫 教室現場直擊（${S[cur].ab}）</h3>${S[cur].ins}</div></div><div class="ic h">${scene(1,cur)}<div><h3>💡 開學前陪伴處方</h3>${S[cur].tip}</div></div>
  <button class="btn gd" onclick="${cur==4?'final()':'map()'}">${cur==4?'查看冒險成果 🎓':'回到地圖 🗺️'}</button>`),500)}
 else to(()=>show(`<div style="font-size:60px">😵</div><h2>${msg}</h2><p>沒關係，勇者再挑戰一次吧！</p><div style="display:flex;gap:10px"><button class="btn sc" onclick="map()">回地圖</button><button class="btn gd" onclick="battle(${cur})">再戰一次 ⚔️</button></div>`),400)}

const G=[
()=>{P.innerHTML='<p id="s"></p><button class="bell" id="b">🔔</button>';const b=$('#b'),s=$('#s');let ok=false,t0=0;
 function nx(){ok=false;b.classList.remove('on');s.textContent='安靜……等待鐘聲';to(()=>{ok=true;t0=Date.now();b.classList.add('on');sfx('bell');s.textContent='響了！快點擊！'},1500+Math.random()*2000)}
 b.onclick=()=>{if(over)return;if(!ok){hurt();s.textContent='太急囉！鐘聲還沒響！';return}ok=false;b.classList.remove('on');s.textContent='反應時間：'+(Date.now()-t0)+' 毫秒！';hit(1);to(nx,1000)};nx()},
()=>{P.innerHTML='<p>只有出現「ㄇ」才攻擊！</p><div class="card big1" id="c">?</div><button class="btn" id="b" style="width:260px">⚔️ 抓到了！（ㄇ）</button>';
 const CH=['ㄅ','ㄆ','ㄈ','ㄉ','ㄊ','ㄋ','ㄌ','ㄍ'];let tg=false,cl=false;
 const tk=()=>{cl=false;tg=Math.random()<.4;$('#c').textContent=tg?'ㄇ':rnd(CH)};tk();ti(tk,1000);
 $('#b').onclick=()=>{if(over||cl)return;cl=true;tg?hit(1):hurt()}},
()=>{const C=[['紅','#ef4444'],['藍','#3b82f6'],['綠','#16a34a'],['黃','#eab308']];let ans='';
 P.innerHTML='<p>只選字的「顏色」，不看字的意思！</p><div class="big1" id="w" style="font-size:64px;letter-spacing:6px"></div><div class="row" id="o"></div>';
 C.forEach(c=>{const b=document.createElement('button');b.className='btn';b.style.background=c[1];b.style.boxShadow='0 6px 0 '+c[1]+'88';b.textContent=c[0]+'色';b.onclick=()=>{if(over)return;c[0]==ans?hit(1):hurt();nx()};$('#o').appendChild(b)});
 function nx(){const a=rnd(C),b=rnd(C);$('#w').textContent=a[0];$('#w').style.color=b[1];ans=b[0]}nx();
 ti(()=>{const d=document.createElement('div');d.className='dis';d.textContent=rnd(['🐦','🧃','✏️','📐','🩹','🧩']);d.style.left=(30+Math.random()*60)+'%';d.style.top=(15+Math.random()*50)+'%';AR.appendChild(d);setTimeout(()=>d.remove(),3400)},900)},
()=>{let rule='S',card;const CD=[['🔴 圓形','圓','紅'],['🟦 方形','方','藍'],['🔵 圓形','圓','藍'],['🟥 方形','方','紅']];
 P.innerHTML='<div class="pill rs" id="bn"></div><div class="big1" id="cd" style="font-size:40px;white-space:nowrap"></div><div class="row"><button class="btn sc" id="b1"></button><button class="btn sc" id="b2"></button></div>';
 function ui(){const sh=rule=='S';$('#bn').className='pill '+(sh?'rs':'rc');$('#bn').textContent=sh?'指令：選【形狀】':'指令：選【顏色】';$('#b1').textContent=sh?'圓形':'紅色';$('#b2').textContent=sh?'方形':'藍色';card=rnd(CD);$('#cd').textContent=card[0]}
 const pick=v=>{if(over)return;(rule=='S'?v==card[1]:v==card[2])?hit(1):hurt();if(Math.random()<.5)rule=rule=='S'?'C':'S';ui()};
 $('#b1').onclick=()=>pick(rule=='S'?'圓':'紅');$('#b2').onclick=()=>pick(rule=='S'?'方':'藍');ui()},
()=>{let ans=0,cw='';const W=['橡皮擦','鉛筆','水壺','手帕','直尺','書包'];
 P.innerHTML='<div class="board" id="f"></div><div class="row" style="grid-template-columns:1fr 1fr 1fr" id="o"></div><div class="bc">📢 廣播：<span id="br">準備中</span></div><button class="btn gd" id="bb" style="width:100%;max-width:400px">🔔 抓到密碼【手帕】！</button>';
 function nx(){const a=1+Math.random()*4|0,b=1+Math.random()*4|0;ans=a+b;$('#f').textContent=a+' + '+b+' = ?';const ch=[ans,ans+1,Math.max(1,ans-1)].sort(()=>Math.random()-.5);$('#o').innerHTML='';ch.forEach(v=>{const x=document.createElement('button');x.className='btn sc';x.textContent=v;x.onclick=()=>{if(over)return;if(v==ans){hit(1);nx()}else hurt()};$('#o').appendChild(x)})}
 function tk(){cw=Math.random()<.3?'手帕':rnd(W.filter(x=>x!='手帕'));$('#br').textContent='「'+cw+'」';say(cw);if(cw=='手帕')sfx('bell')}
 $('#bb').onclick=()=>{if(over)return;if(cw=='手帕'){cw='';$('#br').textContent='抓到了！';hit(2)}else hurt()};nx();tk();ti(tk,2600)}];

function finalOld(){stop();over=true;hide();hud('冒險成果');const t=sum(),r=t>=13?'🏆 專注大勇者':t>=10?'⚔️ 專注騎士':'🛡️ 專注見習生';
 M.innerHTML=`<div class="scr"><div style="font-size:56px">🎓</div><h2>恭喜通關！</h2><div class="dlg" style="font-size:20px;justify-content:center"><b>${r}</b>　⭐ ${t} / 15</div>
 <div class="bars">${S.map((s,i)=>`<div class="bl"><span>${i+1}. ${s.ab}</span><span>${'⭐'.repeat(star[i])||'—'}</span></div><div class="bt"><i style="width:${star[i]/3*100}%"></i></div>`).join('')}</div>
 <div class="dlg"><div class="npc">🧙‍♀️</div><div>專注力像肌肉，越練越強。星星少的關卡，就是接下來最適合陪孩子一起玩的遊戲！<br><small>（本遊戲為親子互動體驗，不是臨床專注力評估。）</small></div></div>
 <div style="display:flex;gap:10px"><button class="btn sc" onclick="map()">回地圖</button><button class="btn gd" onclick="star=[0,0,0,0,0];title()">重新冒險</button></div></div>`}
title();
</script>
